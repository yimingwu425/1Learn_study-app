[package]
name = "study-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
jsonschema = { version = "=0.33.0", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
printpdf = { version = "=0.8.2", default-features = false }
lopdf = { version = "=0.35.0", default-features = false, features = ["nom_parser"] }
tempfile = "3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
jsonwebtoken = "9.3.1"
fs2 = "0.4.3"
base64 = "0.22.1"
futures-util = "0.3.31"

[dev-dependencies]
tempfile = "3"
